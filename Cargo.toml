[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
uuid = {version="^1",features=["v4"]}
serde = {version="^1", features = ["derive"]}
aws-config = "^0.8"
aws-sdk-dynamodb = "^0.8"
env_logger = "0.8"
log = "^0.4"
strum_macros = "^0.24"
strum = {version = "^0.24", features = ["derive"]}
futures = "0.3.28"
tokio = {version = "1.32.0", features = ["full"]}
rand = "0.9.0"
chrono = "0.4.40"
mongodb= "3.2.3"
dotenv = "0.15.0"
bcrypt = "0.12"
base64 = "0.13.1"
jsonwebtoken = "9.3.1"
actix-governor = "0.8.0"
lettre = { version = "0.11.15",features = [
    "tokio1-native-tls",
    "smtp-transport",
    "builder"
] }
http = "0.2.12"
actix-cors = "0.7.1"
time = "0.3.40"
